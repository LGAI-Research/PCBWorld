# Strict condition-based action masking.
# Each action is enabled only when ALL conditions in 'when' match the current state.
# net_end requires the current net to be fully connected; start_route requires it
# NOT fully connected (a completed net can only be ended, never re-routed).

name: default

actions:
  net_select:
    when: {has_net: false, is_routing: false}

  start_route:
    when: {has_net: true, is_routing: false, net_fully_connected: false}

  net_end:
    when: {has_net: true, is_routing: false, net_fully_connected: true}

  make_line:
    when: {is_routing: true}

  make_via:
    when: {is_routing: true}

  finish:
    when: {is_routing: true}
