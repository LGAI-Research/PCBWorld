# W7a — the shipped reward. Potential terms:
#   edge                    : -1.0 per open ratsnest edge
#   per-net completion/clean: +1.0 per fully connected net / +1.0 per DRV-free net (flat counts;
#                             net_bonus_size_linear_scale 0.0 = no per-net size weighting)
#   board completion/clean  : +0.5 * sum(pad groups) when the board is complete / DRV-free
#                             (*_padgroup_scale; pad groups of the bare board, rebound at reset)
#   DRC                     : log_per_net, scale 1 / aggregate 3 / offset 2 (errors_and_promoted)
#   wirelength              : -0.5 * WL / max(bbox_w, bbox_h)
#   via / invalid action    : -0.2 per via / -0.01 per invalid action
# Every run trained or scored with pcbworld_reward (alias drc_log_ladder_linear_w7a) used exactly
# these terms.
# Scale caveat: the board bonus grows with board size — watch v-loss/EV, grad-norm clipping
# and the reward-normalizer std over the first 20-30 iterations on large boards.
# LAUNCH GOTCHA: do not pass --wirelength-penalty / --via-penalty on the CLI (YAML-owned).

name: pcbworld_reward
mode: per_step

potential:
  # --- ladder: flat per-net counts, pad-group-scaled board bonuses ---
  net_completion_bonus: 1.0
  net_clean_bonus: 1.0
  net_bonus_size_linear_scale: 0.0
  completion_bonus_padgroup_scale: 0.5
  clean_completion_bonus_padgroup_scale: 0.5
  # --- edge / wire / via / DRC ---
  unconnected_penalty: 1.0
  wirelength_penalty: 0.5
  wirelength_bbox_normalize: true
  via_penalty: 0.2
  wire_via_emission: per_step
  drc_shape: log_per_net
  drc_log_scale: 1.0
  drc_log_agg_scale: 3.0
  drc_log_offset: 2.0
  step_penalty: 0.0
  truncation_mode: none
  drc_severity_mode: errors_and_promoted
  invalid_action_penalty: 0.01
  parse_fail_penalty: 0.2
  mask_reject_penalty: 0.09
