# W7a (2026-09-01) — linear-currency ladder. Same as W6 (drc_log_ladder_sw_wlnorm,
# the c0903v3 / BC comparison reward) except for the ladder SHAPE:
#   per-net  completion/clean : 1.0 * ln(1+pg_i)  ->  0.5 * pg_i      (net_bonus_size_linear_scale)
#   board    completion/clean : 2.0 * ln(1+N)     ->  0.5 * sum(pg)   (*_padgroup_scale)
# Everything else (edge -1, DRC log_per_net 1/3/2, WL 0.5 bbox-normalized, via 0.2,
# invalid 0.01) is W6 as-is, so the net effect of the ladder axis reads directly.
#
# Rationale: under W6 ~90% of the potential budget is edge + per-net mass and the board
# ladder is ~10%, so fp and success decouple (F1: best fp without finishing boards).
# With the linear currency the per-net mass on a median board (~sum(pg) ~ 71) overtakes
# the edge mass (~41) and the board ladder (0.5 * sum(pg) ~ 35) is on par with the edge
# mass, so "closing the last net" becomes the dominant incentive for the first time.
# dense:sparse ~ 112:71 keeps the early learning signal.
# Scale caveat: terminal spikes grow on large boards — watch v-loss/EV, grad-norm
# clipping and the reward-normalizer std over the first 20-30 iterations; if unstable,
# drop the board scale 0.5 -> 0.25.
# LAUNCH GOTCHA: do not pass --wirelength-penalty / --via-penalty on the CLI (YAML-owned).

name: pcbworld_reward
mode: per_step

potential:
  # --- ladder (linear currency) ---
  net_completion_bonus: 1.0
  net_clean_bonus: 1.0
  net_bonus_size_linear_scale: 0.5
  completion_bonus_padgroup_scale: 0.5
  clean_completion_bonus_padgroup_scale: 0.5
  # --- W6 as-is below ---
  unconnected_penalty: 1.0
  wirelength_penalty: 0.5
  wirelength_bbox_normalize: true
  via_penalty: 0.2
  wire_via_emission: per_step
  drc_shape: log_per_net
  drc_log_scale: 1.0
  drc_log_agg_scale: 3.0
  drc_log_offset: 2.0
  step_penalty: 0.0
  truncation_mode: none
  drc_severity_mode: errors_and_promoted
  invalid_action_penalty: 0.01
