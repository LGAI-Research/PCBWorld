# LEGACY — retained for test compatibility only (tests/test_env/test_aug_scale_reward.py
# asserts specific aug_scale behavior under this config's terminal-mode semantics).
# Not used by v20+ training. Scheduled for deletion in a later cleanup phase
# once aug_scale tests are migrated off the legacy reward configs.
#
# Default reward config: terminal mode (episode-end Φ only).
# Only step_penalty per step, Φ(s_final) at episode end.
# DRC disabled by setting drc_penalty: 0.0.

name: default
mode: terminal           # "terminal" | "per_step"

potential:
  completion_bonus: 5.0
  unconnected_penalty: 1.0
  wirelength_penalty: 0.0
  drc_penalty: 0.0
  step_penalty: 0.01
  truncation_mode: none    # "none" | "penalty_only" | "full"
