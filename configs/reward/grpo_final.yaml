# GRPO terminal reward: no per-step shaping, episode-end potential-based reward.

name: grpo_final
mode: terminal

potential:
  completion_bonus_log_scale: 2.0
  unconnected_penalty: 2.0
  wirelength_penalty: 0.002
  via_penalty: 0.1
  drc_shape: log_per_net
  drc_log_scale: 0.5
  drc_log_agg_scale: 1.5
  drc_log_offset: 2.0
  step_penalty: 0.01
  invalid_action_penalty: 0.01
  truncation_mode: full
