# Transformer/KiCad physical-wirelength equivalent of Jumanji Connector dense reward.
#
# Connector-v2 applies a per-grid-step penalty to every still-moving agent.
# The KiCad 1L datasets map a 100mm board to grid{10,100,1000}, so:
#   grid10:   0.03 / 10mm  = 0.003 per mm
#   grid100:  0.003 / 1mm  = 0.003 per mm
#   grid1000: 0.0003 / .1mm = 0.003 per mm
#
# Thus the Transformer PPO L1 comparison uses:
#   r_t = newly_connected_nets - 0.003 * delta_wirelength_mm
#
# unconnected_penalty below is CADAgent's legacy potential term.  It is set to
# zero because the Jumanji movement cost is represented by wirelength_penalty
# in this KiCad variant; this does not change the Jumanji/SABLE baseline reward.

name: jumanji_connector_wirelength_dense
mode: per_step

potential:
  jumanji_connector_wirelength_dense: true
  completion_bonus: 0.0
  unconnected_penalty: 0.0
  wirelength_penalty: 0.003
  via_penalty: 0.0
  drc_penalty: 0.0
  step_penalty: 0.0
  truncation_mode: none
