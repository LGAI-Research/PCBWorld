# Sparse (final-only) DRC potential, error-only severity gate.
# Only error-severity DRCs are counted. Potential is credited once at episode
# end (Φ(s_final) - Φ(s_0) as a single terminal reward).

name: drc_sparse_error
mode: terminal

potential:
  completion_bonus_log_scale: 1.0
  unconnected_penalty: 1.0
  wirelength_penalty: 0.0
  drc_shape: log_per_net
  drc_log_scale: 1.0
  drc_log_agg_scale: 3.0
  drc_log_offset: 2.0
  step_penalty: 0.0
  truncation_mode: none
  drc_penalty_include_warning: false
