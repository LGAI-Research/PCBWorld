# Jumanji Connector dense reward, used by the 1-layer method comparison.
#
# Team-aggregate form:
#   r_t = newly_connected_nets - step_penalty * unconnected_before
#
# The grid-specific step_penalty is supplied by launchers via
# --reward-step-penalty:
#   grid10   -> 0.03
#   grid100  -> 0.003
#   grid1000 -> 0.0003

name: jumanji_connector_dense
mode: per_step

potential:
  jumanji_connector_dense: true
  completion_bonus: 0.0
  unconnected_penalty: 1.0
  wirelength_penalty: 0.0
  via_penalty: 0.0
  drc_penalty: 0.0
  step_penalty: 0.03
  truncation_mode: none
