# configs/env.yaml — env-core defaults shared by the RL and LLM programs. File map and how defaults load: configs/loader/schema.py.

# ────────────────────────────────────────────────────────────────────────────────────────────────────
env:
  # Shared env-core defaults  →  configs.loader.schema.EnvConfig (+ EnvConfig.reward)
  #
  # SINGLE SOURCE for the env construction knobs. The SAME values are used as:
  #   * the RL-training argparse defaults (methods/rl_agent/training/args.py).
  # Eval reads the env config the policy was TRAINED with from the checkpoint
  # (RLEnvConfig.from_checkpoint); a key the checkpoint predates takes its pre-knob
  # value from configs/ckpt_migrations.yaml, never these.
  #
  # Values below are the training defaults (training is what writes the ckpt).
  # corner_mode is the routing angle in degrees (45 or 90); the env turns it into
  # the engine code (pcb_world.core.env.corner_mode_code).

  max_steps: 1024
  masking_rule: pcbworld_masking                # configs/masking/<name>.yaml — the one shipped rule (net_end free, no finish)
  net_reselect: false               # false: net_end retires the net for the episode (the net-valid mask drops it).
                                    # true: a net closed with ratsnest left stays a net_select target and selecting
                                    # it reopens it (env); termination unchanged. Checkpoints store it.
  reward_rule: pcbworld_reward                 # configs/reward/<name>.yaml — the one shipped rule (flat per-net ladder, pad-group-scaled board bonuses)
  reward_noise_std: 0.0
  reward_noise_clip_sigma: 4.0      # the reward noise is clipped to ±this × reward_noise_std
  drc_incremental: true             # per-step DRC re-checks only the changed items (tested equal
                                    # to a full DRC); false = a full DRC every step. Episode-end DRC is full.
  drc_promoted_codes: [12, 13, 37]  # KiCad PCB_DRC_CODE (pcbnew/drc/drc_item.h) warnings counted as
                                    # errors by drc_severity_mode errors_and_promoted: 12 dangling via,
                                    # 13 dangling track, 37 net conflict. Re-sync if KiCad renumbers.
  emit_drc_tokens: true
  corner_mode: 45
  rules_source: board               # board: .kicad_pro / legacy (setup ...) rules required.
                                    # board_or_yaml: a board with neither gets drc_config_path's minima.
  drc_config_path: null             # required (no implicit default) when rules_source is board_or_yaml
  engine_seed: 77                   # KIID/UUID seed set once at engine init →
                                    # reproducible routing + UUID-keyed DRC. <0 = entropy.
  shove_iter_limit: 250             # PNS shove loop iteration bound (wallclock timeout
                                    # removed for determinism; this is the reproducible cap).
  followbranch_iter_limit: 1000000  # TOPOLOGY::followBranch DFS pop bound (ditto).
  reject_if_stuck: true             # make_line aborts (draws nothing, action fails) when the
                                    # walkaround can't reach the target, instead of committing a
                                    # partial dangling stub. false = legacy commit-partial behavior.
  trim_at_contact: false            # just before each make_line/make_via/finish commit, on every net it
                                    # touches (incl. shoved ones): drop copper lying on same-net copper, split
                                    # tracks at T/X junctions and vias so they are joints. Not re-routed; vias kept.
  simplify_outline: true           # load-time rewrite of tessellated micro-segment outline
                                    # chains (Edge.Cuts/Margin) into native arcs/merged lines
                                    # (pcb_world/engine/outline_simplify.py). Kills the PNS
                                    # walkaround cluster blowup on baked-curve boards; changes
                                    # obs EDGE token counts, so keep off inside a running
                                    # campaign for comparability.
  obs_format: json                  # observation format the env emits: "json" = legacy nested
                                    # dict; "indexed" = indexed_v1 array tables (pcb_world/core/
                                    # indexed_obs.py) — cheaper to pickle/tokenize, bit-identical
                                    # tokens. RL-decoder-only; LLM/eval paths stay on json.
  outline_obs: arc                 # Edge.Cuts representation in the obs boardlines:
                                    # "tess" = C++ error-bounded tessellation (0.005mm, legacy/
                                    # current); "poly16" = fixed 16-per-90° re-tessellation
                                    # (pre-074f34b09 A/B reference); "arc" = one entry per arc/
                                    # circle with the on-arc midpoint (obs-schema change =>
                                    # retrain; legacy 2-point ckpts refuse arc obs).
  action_history_len: 1             # obs["action_history"] window: how many recent action
                                    # records (type/pointer/net/success) the env keeps and
                                    # emits, newest first. Default 1 = the historical
                                    # prev-action single-step window (compat-conservative);
                                    # history ablations raise it via --action-history-len.
                                    # Legacy ckpts consume entry 0 only.
  net_constraint_obs: true         # per-net DRC constraint observation: every board_static
                                    # net carries its resolved netclass values (track_width/
                                    # clearance/via_diameter/via_drill; KiCad inherit→Default
                                    # — the sizes the engine routes that net with), feeding
                                    # the NET-token tw/cl/vd channels
                                    # (constant 0 when off). Obs-drift => retrain; the ckpt
                                    # stores the setting so eval follows automatically.
  directional_candidates: multi_resolution   # directional (ring) candidate preset (pcb_world/vec/candidate_pool.py);
                                  # null/'none' = the default 8-direction 0.5 mm ring. Checkpoints store it.
  offboard_mask: true               # hard-mask directional candidates whose (x, y) falls outside the board
                                  # outline. Pre-knob checkpoints eval with it off (schema pin).
  keep_routing_fraction: null       # keep-routing augmentation (train-only): [lo, hi] →
                                    # each board load samples f~U[lo,hi] and keeps that
                                    # fraction of the nets' file routing as the episode's
                                    # initial state (rest re-routed from scratch). Needs
                                    # boards whose file carries complete routing (d3 real
                                    # boards). null = off; eval always off.

  # Per-run overrides of the selected reward_rule YAML (None = use the rule's
  # value). -> configs.loader.schema.RewardOverrides (EnvConfig.reward).
  reward:
    via_penalty: null
    wirelength_penalty: null
    drc_penalty: null
    drc_log_scale: null
    drc_log_agg_scale: null
    drc_log_offset: null
    reward_step_penalty: null
    wire_via_emission: null
