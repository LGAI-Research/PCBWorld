# Relaxed condition-based action masking.
# Same as strict, but net_end is allowed regardless of connection status.

name: relaxed

actions:
  net_select:
    when: {has_net: false, is_routing: false}

  start_route:
    when: {has_net: true, is_routing: false, net_fully_connected: false}

  net_end:
    when: {has_net: true, is_routing: false}

  make_line:
    when: {is_routing: true}

  make_via:
    when: {is_routing: true}

  finish:
    when: {is_routing: true}
