# Errors-only variant of the Table 1 PPO training reward: drc_dense_promoted with the training
# overrides baked in (wirelength_penalty 0.002, via_penalty 0.1) and the DRC severity gate set
# to ``errors_only``, so Φ counts only ERROR-severity DRVs — the three promoted warnings
# (track_dangling / via_dangling / net_conflict) and track-angle violations are reported but do
# not subtract from Φ. The KDD recipes score with the plain drc_dense_promoted
# (experiments/kdd/configs/paper_train_flags.sh PAPER_SCORING_FLAGS).

name: drc_dense_errors_only_eval
mode: per_step

potential:
  completion_bonus_log_scale: 1.0
  unconnected_penalty: 1.0
  wirelength_penalty: 0.002
  via_penalty: 0.1
  wire_via_emission: per_step
  drc_shape: log_per_net
  drc_log_scale: 1.0
  drc_log_agg_scale: 3.0
  drc_log_offset: 2.0
  step_penalty: 0.0
  truncation_mode: none
  drc_severity_mode: errors_only
  invalid_action_penalty: 0.01
  parse_fail_penalty: 0.2
  mask_reject_penalty: 0.09
