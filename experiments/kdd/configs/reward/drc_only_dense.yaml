# All-log DRC potential: aggregate (breadth) + per-net (depth), both log,
# sharing the same drc_log_offset (knee).
#   Φ_drc(s) = -drc_log_agg_scale · ln(1 + x / drc_log_offset)
#              -Σ_i drc_log_scale · ln(1 + x_i / drc_log_offset)
# where x = number of offending nets (incl. orphan phantom), x_i = per-net
# violation count. Two orthogonal signals: breadth (#nets dirty) and depth
# (violations per net). completion_bonus resolved at env init as
#   completion_bonus = completion_bonus_log_scale · ln(1 + net_count)

name: drc_only_dense
mode: per_step

potential:
  completion_bonus_log_scale: 1.0
  unconnected_penalty: 1.0
  wirelength_penalty: 0.0
  drc_shape: log_per_net
  drc_log_scale: 1.0
  drc_log_agg_scale: 3.0
  drc_log_offset: 2.0
  step_penalty: 0.0
  truncation_mode: none
